task_type_routing:

  CODING:
    preferred_tags:
      - code_generation
      - script_writing
    required_tools:
      - sandbox_execute
    requires_rag: false
    requires_sandbox: true

  HYBRID:
    preferred_tags:
      - code_generation
      - calculation_scripting
    required_tools:
      - rag_search
      - sandbox_execute
    requires_rag: true
    requires_sandbox: true

  RAG:
    preferred_tags:
      - general_reasoning
      - qa
    required_tools:
      - rag_search
    requires_rag: true
    requires_sandbox: false

  GENERAL:
    preferred_tags:
      - general_reasoning
    required_tools: []
    requires_rag: false
    requires_sandbox: false

  VISION:
    preferred_tags:
      - image_understanding
      - drawing_understanding
    required_tools: []
    requires_rag: false
    requires_sandbox: false

  DOCUMENT_ANALYSIS:
    preferred_tags:
      - document_summary
      - findings_extraction
    required_tools:
      - rag_search
    requires_rag: true
    requires_sandbox: false

  general_chat:
    preferred_tags:
      - general_reasoning
    required_tools: []

  general_reasoning:
    preferred_tags:
      - general_reasoning
      - qa
    required_tools:
      - rag_search

  document_summary:
    preferred_tags:
      - document_summary
      - findings_extraction
    required_tools:
      - rag_search

  approval_note:
    preferred_tags:
      - approval_note_drafting
      - document_summary
    required_tools:
      - rag_search
      - docgen_docx

  code_generation:
    preferred_tags:
      - code_generation
      - script_writing
    required_tools:
      - sandbox_execute

  calculation:
    preferred_tags:
      - calculation_scripting
      - code_generation
    required_tools:
      - sandbox_execute

  image_or_drawing_understanding:
    preferred_tags:
      - image_understanding
      - drawing_understanding
    required_tools: []

  synthesis:
    preferred_tags:
      - synthesis
      - general_reasoning
    required_tools: []

tools:

  - id: rag_search
    display_name: "Local Knowledge Base (RAG)"
    endpoint: "http://127.0.0.1:8001/rag/query"
    description: >
      Retrieves relevant chunks from the local ChromaDB
      knowledge base.
    enabled: true

  - id: ocr_extract
    display_name: "PaddleOCR Extraction"
    endpoint: "http://127.0.0.1:8001/ocr/extract"
    description: >
      Extracts text from scanned or printed PDF pages
      and images.
    enabled: true

  - id: sandbox_execute
    display_name: "Code Sandbox"
    endpoint: "http://127.0.0.1:8002/sandbox/execute"
    description: >
      Executes code in an isolated Docker container with network
      disabled, read-only filesystem, non-root user, and hard
      resource limits. Returns stdout, stderr, and exit code.
    enabled: true

  - id: docgen_docx
    display_name: "DOCX Generator"
    endpoint: "http://127.0.0.1:8003/docgen/docx"
    description: >
      Generates a Word document from structured content.
    enabled: true

  - id: docgen_pdf
    display_name: "PDF Generator"
    endpoint: "http://127.0.0.1:8003/docgen/pdf"
    description: >
      Generates a formal technical PDF report using ReportLab.
    enabled: true