# config/scope_rules.yaml
# Deterministic Scope Guard configuration for MRPL Sovereign AI Workbench

version: "1.0.0"
mode: "enforcing"  # "enforcing" | "permissive" | "audit_only"

# Supported Industrial & Engineering Task Categories
supported_categories:
  - id: "refining_operations"
    name: "Refining & Process Operations"
    description: "Crude distillation (CDU), hydrocracking (HCU), fluidized catalytic cracking (PFCCU), coking, desalting, blending."
    keywords:
      - "refinery"
      - "refining"
      - "crude"
      - "cdu"
      - "vdu"
      - "hcu"
      - "hydrocracker"
      - "pfccu"
      - "fccu"
      - "polypropylene"
      - "naphtha"
      - "diesel"
      - "kerosene"
      - "atf"
      - "lpg"
      - "bitumen"
      - "furnace"
      - "distillation"
      - "desalination"
      - "grm"
      - "throughput"
      - "capacity"
      - "yield"

  - id: "hse_and_safety"
    name: "Health, Safety & Environment (HSE)"
    description: "Industrial plant safety, permit-to-work, fire fighting, gas detection, environmental compliance, CVC vigilance, PIDPI."
    keywords:
      - "safety"
      - "hse"
      - "permit"
      - "hazard"
      - "fire"
      - "effluent"
      - "emission"
      - "kspcb"
      - "moef"
      - "crz"
      - "clearance"
      - "vigilance"
      - "complaint"
      - "pidpi"
      - "cvc"
      - "pollution"
      - "ambient"
      - "monitoring"
      - "leak"
      - "ppe"

  - id: "engineering_and_maintenance"
    name: "Plant Engineering, Maintenance & Drawings"
    description: "P&IDs, piping, instrumentation, rotating machinery, inspection, ISO/AS standards, technical specifications."
    keywords:
      - "p&id"
      - "pid"
      - "drawing"
      - "piping"
      - "instrumentation"
      - "pump"
      - "compressor"
      - "valve"
      - "turbine"
      - "heat exchanger"
      - "isometric"
      - "asme"
      - "api"
      - "iso"
      - "maintenance"
      - "vibration"
      - "corrosion"
      - "inspection"
      - "tag"
      - "equipment"

  - id: "corporate_finance_and_reports"
    name: "Corporate, Annual Reports & Finance"
    description: "MRPL corporate policies, annual reports, financial disclosures, SEBI filings, governance, CSR."
    keywords:
      - "annual report"
      - "financial"
      - "revenue"
      - "turnover"
      - "profit"
      - "pat"
      - "pbt"
      - "ebitda"
      - "exports"
      - "balance sheet"
      - "fiscal"
      - "fy"
      - "ongc"
      - "director"
      - "audit"
      - "csr"
      - "rti"
      - "shareholder"

  - id: "technical_calculation_and_code"
    name: "Technical Calculations & Automation Scripting"
    description: "Refinery unit yield modeling, material balance, pressure drop calculations, Python data analysis."
    keywords:
      - "calculate"
      - "computation"
      - "script"
      - "python"
      - "code"
      - "function"
      - "algorithm"
      - "formula"
      - "data"
      - "dataframe"
      - "pandas"
      - "numpy"
      - "ratio"
      - "percentage"
      - "variance"
      - "growth"

  - id: "document_analysis"
    name: "Document Ingestion & Analysis"
    description: "Inspection, summarization, extraction of notes, compliance findings from uploaded operational manuals or filings."
    keywords:
      - "analyze"
      - "analysis"
      - "document"
      - "manual"
      - "page"
      - "extract"
      - "summarize"
      - "findings"
      - "notes"
      - "exceptions"
      - "pdf"
      - "docx"

  - id: "system_and_general"
    name: "Workbench Capabilities & System Support"
    description: "Greetings, operational guidance on how to use the workbench, model info, security seal checks."
    keywords:
      - "hello"
      - "hi"
      - "hey"
      - "help"
      - "what can you do"
      - "who are you"
      - "capabilities"
      - "system status"
      - "models"
      - "workbench"
      - "guidance"

# Explicit Out-of-Scope Patterns & Prohibited Topics
prohibited_domains:
  - id: "creative_entertainment"
    name: "Entertainment & Pop Culture"
    reason: "MRPL Sovereign AI is dedicated exclusively to refinery operations, industrial safety, and technical engineering."
    patterns:
      - "(?i)\\b(write|generate|compose|create)\\s+(a\\s+)?([a-z]+\\s+)?(poem|song|story|stories|fairy\\s*tale|romance|rap|joke|novel)\\b"
      - "(?i)\\b(movies?|cinemas?|films?|hollywood|bollywood|celebritys?|celebrities|actors?|actress(?:es)?|pop\\s+stars?|oscars?|netflix|box\\s+office)\\b"
      - "(?i)\\b(video\\s+games?|gaming|playstation|xbox|nintendo|minecraft|fortnite|esports|elden\\s+ring)\\b"

  - id: "recreational_sports"
    name: "Sports & Trivia"
    reason: "Recreational sports trivia and non-industrial commentary are out of scope for the sovereign engineering workbench."
    patterns:
      - "(?i)\\b(cricket|ipl\\s+match|world\\s+cup|football\\s+match|fifa|premier\\s+league|nba|tennis|badminton)\\b"
      - "(?i)\\b(who\\s+won\\s+the\\s+match|cricket\\s+player|footballer)\\b"

  - id: "personal_unrelated"
    name: "Personal Life, Cooking & Non-Industrial Advice"
    reason: "Personal life coaching, cooking recipes, dating advice, and medical diagnoses are strictly outside industrial scope."
    patterns:
      - "(?i)\\b(recipes?|cake|bake|baking|frosting|chocolate|dessert|cocktail|cooking)\\b"
      - "(?i)\\b(relationship\\s+advice|dating\\s+tips|horoscope|astrology|zodiac)\\b"
      - "(?i)\\b(prescribe\\s+(a\\s+)?medicine|medical\\s+diagnosis|symptoms\\s+of\\s+cancer)\\b"

  - id: "unrelated_general_trivia"
    name: "General World Trivia & Non-Industrial Homework"
    reason: "General non-engineering world trivia is out of scope. Please consult authorized industrial manuals or operational files."
    patterns:
      - "(?i)\\b(who\\s+is\\s+the\\s+president\\s+of\\s+(france|usa|italy|germany))\\b"
      - "(?i)\\b(capital\\s+of\\s+(australia|canada|brazil|france))\\b"
